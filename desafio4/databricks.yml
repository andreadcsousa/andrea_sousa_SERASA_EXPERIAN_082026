bundle:
  name: fraud_pipeline

variables:
  quality_threshold:
    description: "Percentual mínimo de qualidade exigido"
    default: "0.95"

resources:
  jobs:
    fraud_pipeline:
      name: fraud_pipeline

      job_clusters:
        - job_cluster_key: default_cluster
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 2

      tasks:
        - task_key: pipeline_task
          job_cluster_key: default_cluster
          spark_python_task:
            python_file: ../contracts/validate_contract.py

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    resources:
      jobs:
        fraud_pipeline:
          job_clusters:
            - job_cluster_key: default_cluster
              new_cluster:
                node_type_id: Standard_DS4_v2
                num_workers: 4
